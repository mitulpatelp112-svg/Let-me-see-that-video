[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "letmesee"
version = "0.1.0"
description = "Absorb videos shared from Instagram/TikTok/YouTube into a local, searchable library, via CLI or an always-on Telegram bot."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
# Optional local transcription when a video has no captions.
transcribe = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7.0"]

[project.scripts]
letmesee = "letmesee.cli:main"

[tool.setuptools]
packages = ["letmesee"]
